name: AI Factory Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  AI_FACTORY_MODEL: ${{ secrets.AI_FACTORY_MODEL }}
  AI_FACTORY_BASE_URL: ${{ secrets.AI_FACTORY_BASE_URL }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Factory
        run: python -m compileall factory
      - name: Run Factory smoke test
        run: python -m factory "Create a research assistant"
      - name: Run example tests
        run: |
          python -m unittest discover -s factory/examples -p 'test_*.py'
      - name: Run autonomous Factory demonstration
        run: python -m factory.examples.autonomous_demo
      - name: Check LLM configuration
        env:
          AI_FACTORY_API_KEY: ${{ secrets.AI_FACTORY_API_KEY }}
        run: |
          if [ -z "$AI_FACTORY_API_KEY" ] || [ -z "$AI_FACTORY_MODEL" ]; then
            echo "LLM secrets are not configured; skipping provider check."
            exit 0
          fi
          python -m factory.providers.provider_check
