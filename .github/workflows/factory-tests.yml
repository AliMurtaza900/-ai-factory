name: AI Factory Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'generated/production/**'
  pull_request:
  workflow_dispatch:
    inputs:
      goal:
        description: Goal for the AI Factory to build
        required: true
        default: Create a multi-agent AI research company that receives a business question, researches the topic using multiple sources, verifies and compares the evidence, performs financial and market analysis, identifies risks and uncertainties, writes an executive report, and has a final reviewer validate the report before delivery.
        type: string
      max_attempts:
        required: false
        default: '5'
        type: string
      run_real_provider_smoke:
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ai-factory-${{ github.ref }}
  cancel-in-progress: true

env:
  AI_FACTORY_PROVIDER: gemini
  AI_FACTORY_MODEL: ${{ secrets.AI_FACTORY_MODEL }}
  AI_FACTORY_GEMINI_KEY: ${{ secrets.AI_FACTORY_API_KEY }}
  AI_FACTORY_GEMINI_MODEL: ${{ secrets.AI_FACTORY_MODEL }}
  AI_FACTORY_GROQ_KEY: ${{ secrets.AI_FACTORY_GROQ_KEY }}
  AI_FACTORY_GROQ_MODEL: ${{ secrets.AI_FACTORY_GROQ_MODEL }}
  AI_FACTORY_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  AI_FACTORY_GITHUB_MODEL: ${{ secrets.AI_FACTORY_GITHUB_MODEL }}
  AI_FACTORY_OPENAI_KEY: ${{ secrets.AI_FACTORY_OPENAI_KEY }}
  AI_FACTORY_OPENAI_MODEL: ${{ secrets.AI_FACTORY_OPENAI_MODEL }}
  AI_FACTORY_CEREBRAS_KEY: ${{ secrets.AI_FACTORY_CEREBRAS_KEY }}
  AI_FACTORY_CEREBRAS_MODEL: ${{ secrets.AI_FACTORY_CEREBRAS_MODEL }}
  AI_FACTORY_OPENROUTER_KEY: ${{ secrets.AI_FACTORY_OPENROUTER_KEY }}
  AI_FACTORY_OPENROUTER_MODEL: ${{ secrets.AI_FACTORY_OPENROUTER_MODEL }}
  AI_FACTORY_ENABLE_LLM_ARCHITECT: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Factory
        run: python -m compileall factory
      - name: Run Factory smoke test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m factory "Create a research assistant"
      - name: Run example tests
        run: python -m unittest discover -s factory/examples -p 'test_*.py'
      - name: Run Patch Gate tests
        run: python -m unittest factory.examples.test_patch_gate
      - name: Run Patch Gate demonstration
        run: python -m factory.examples.patch_gate_demo
      - name: Run autonomous demonstration
        env:
          AI_FACTORY_API_KEY: ${{ secrets.AI_FACTORY_API_KEY }}
          AI_FACTORY_ENABLE_LLM_ARCHITECT: '1'
          AI_FACTORY_ENABLE_LLM_REVISION: '1'
        run: python -m factory.examples.autonomous_demo
      - name: Diagnose provider chain
        run: python -m factory.providers.provider_check
      - name: Prepare production output
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
        run: rm -rf generated/production
      - name: Generate production system
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          goal='${{ inputs.goal }}'
          if [ -z "$goal" ]; then goal='Create a multi-agent AI research company that receives a business question, researches the topic using multiple sources, verifies and compares the evidence, performs financial and market analysis, identifies risks and uncertainties, writes an executive report, and has a final reviewer validate the report before delivery.'; fi
          attempts='${{ inputs.max_attempts }}'
          if [ -z "$attempts" ]; then attempts='5'; fi
          python -m factory "$goal" --workspace generated/production --max-attempts "$attempts"
      - name: Normalize generated project name
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
        run: |
          set -e
          root="generated/production"
          candidates=$(find "$root" -mindepth 1 -maxdepth 1 -type d | sort)
          if [ -f "$root/team.json" ]; then
            echo 'Generated system is already rooted at generated/production.'
          elif [ "$(printf '%s\n' "$candidates" | sed '/^$/d' | wc -l)" -eq 1 ]; then
            source=$(printf '%s\n' "$candidates" | head -n1)
            target="$root/Synthetix-Research-Intelligence-Agency"
            if [ "$source" != "$target" ]; then mv "$source" "$target"; fi
            echo "Normalized generated project path to $target"
          else
            echo "Expected exactly one generated project directory, found:"
            printf '%s\n' "$candidates"
            exit 1
          fi
      - name: Verify standalone system
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
        run: |
          set -e
          root="generated/production"
          candidates=$(find "$root" -mindepth 1 -maxdepth 1 -type d | sort)
          if [ -f "$root/team.json" ]; then :; elif [ "$(printf '%s\n' "$candidates" | sed '/^$/d' | wc -l)" -eq 1 ]; then root=$(printf '%s\n' "$candidates" | head -n1); else exit 1; fi
          test -f "$root/team.json"; test -f "$root/run.py"; test -f "$root/runtime/provider.py"; test -f "$root/requirements.txt"
          if grep -R "from factory\." "$root"; then exit 1; fi
          python - "$root" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1]); data=json.loads((root/'team.json').read_text())
          required={'researcher','verifier','market_analyst','risk_analyst','writer','reviewer'}
          names={str(x.get('name','')).lower() for x in data.get('members',[])}
          missing=required-names
          if missing: raise SystemExit(f'missing agents: {sorted(missing)}')
          if data.get('entrypoint')!='run.py': raise SystemExit('missing run.py entrypoint')
          print('Verified six-agent standalone runnable team')
          PY
      - name: Run generated system end to end
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
        env:
          AI_FACTORY_MOCK: '1'
        run: |
          set -e
          root="generated/production"
          candidates=$(find "$root" -mindepth 1 -maxdepth 1 -type d | sort)
          if [ ! -f "$root/run.py" ] && [ "$(printf '%s\n' "$candidates" | sed '/^$/d' | wc -l)" -eq 1 ]; then root=$(printf '%s\n' "$candidates" | head -n1); fi
          cd "$root"
          python -m compileall .
          python - <<'PY'
          import importlib
          from pathlib import Path
          expected=['market_analyst','researcher','reviewer','risk_analyst','verifier','writer']
          found=sorted(p.parent.name for p in Path('agents').glob('*/agent.py'))
          if found!=expected: raise SystemExit(f'unexpected agents: {found}')
          for name in found:
              if not hasattr(importlib.import_module(f'agents.{name}.agent'),'Agent'): raise SystemExit(f'missing Agent class: {name}')
          result=importlib.import_module('run').run('Should a business expand into a new market?')
          if result.get('status')!='completed': raise SystemExit(f'pipeline failed: {result}')
          if result.get('agents')!=['researcher','verifier','market_analyst','risk_analyst','writer','reviewer']: raise SystemExit('wrong execution order')
          if not result.get('final_report'): raise SystemExit('missing final report')
          print('END-TO-END GENERATED SYSTEM PASSED')
          PY
      - name: Run generated system with a real provider
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_real_provider_smoke }}
        run: |
          set -e
          root="generated/production"
          if [ -d "$root/Synthetix-Research-Intelligence-Agency" ]; then root="$root/Synthetix-Research-Intelligence-Agency"; fi
          test -n "${AI_FACTORY_GEMINI_KEY:-}" || test -n "${AI_FACTORY_OPENAI_KEY:-}" || test -n "${AI_FACTORY_GROQ_KEY:-}" || test -n "${AI_FACTORY_OPENROUTER_KEY:-}"
          cd "$root"
          env -u AI_FACTORY_MOCK python - <<'PY'
          import importlib
          result=importlib.import_module('run').run('Give a concise evidence-based answer to: what is one major risk a new business should assess before entering a foreign market?')
          if result.get('status')!='completed': raise SystemExit(f'real-provider pipeline failed: {result}')
          if not result.get('final_report'): raise SystemExit('real-provider run produced no final report')
          print('REAL-PROVIDER GENERATED SYSTEM PASSED')
          PY
      - name: Write artifact manifest
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('generated/production')
          for cache in root.rglob('__pycache__'):
              for p in cache.iterdir(): p.unlink()
              cache.rmdir()
          for p in root.rglob('*.pyc'): p.unlink()
          specs=[p for p in root.rglob('SPEC.json') if (p.parent/'team.json').is_file() and (p.parent/'run.py').is_file()]
          if len(specs)!=1: raise SystemExit(f'Expected exactly one top-level generated SPEC.json, found {len(specs)}')
          spec=json.loads(specs[0].read_text(encoding='utf-8'))
          goal=str(spec.get('purpose','')).strip()
          if not goal: raise SystemExit('Generated SPEC.json has no non-empty purpose')
          files=sorted(str(p.relative_to(root)) for p in root.rglob('*') if p.is_file())
          (root/'FACTORY_ARTIFACT.json').write_text(json.dumps({'artifact_type':'standalone_generated_ai_system','goal':goal,'files':files,'entrypoint':'run.py','end_to_end_test':'passed'},indent=2)+'\n',encoding='utf-8')
          print('Artifact manifest validated:', goal)
          PY
      - name: Publish generated result
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && success() }}
        run: |
          set -e
          git config user.name "AI Factory"
          git config user.email "ai-factory@users.noreply.github.com"
          git add generated/production
          if git diff --cached --quiet; then
            echo 'No generated output changes.'
            exit 0
          fi
          git commit -m 'Publish runnable standalone AI system'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Upload generated artifact
        if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-factory-generated-agent-${{ github.run_number }}
          path: generated/production
          if-no-files-found: error
          retention-days: 14
