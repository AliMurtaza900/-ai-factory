name: AI Factory Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'generated/production/**'
  pull_request:
  workflow_dispatch:
    inputs:
      goal:
        description: "Goal for the AI Factory to build"
        required: true
        default: "Create a multi-agent AI research company that receives a business question, researches the topic using multiple sources, verifies and compares the evidence, performs financial and market analysis, identifies risks and uncertainties, writes an executive report, and has a final reviewer validate the report before delivery."
        type: string
      max_attempts:
        required: false
        default: "5"
        type: string
      run_real_provider_smoke:
        description: "Call a live AI provider during generated-system smoke test (optional; never required for artifact validity)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  AI_FACTORY_PROVIDER: gemini
  AI_FACTORY_MODEL: ${{ secrets.AI_FACTORY_MODEL }}
  AI_FACTORY_GEMINI_KEY: ${{ secrets.AI_FACTORY_API_KEY }}
  AI_FACTORY_GEMINI_MODEL: ${{ secrets.AI_FACTORY_MODEL }}
  AI_FACTORY_GROQ_KEY: ${{ secrets.AI_FACTORY_GROQ_KEY }}
  AI_FACTORY_GROQ_MODEL: ${{ secrets.AI_FACTORY_GROQ_MODEL }}
  AI_FACTORY_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  AI_FACTORY_GITHUB_MODEL: ${{ secrets.AI_FACTORY_GITHUB_MODEL }}
  AI_FACTORY_OPENAI_KEY: ${{ secrets.AI_FACTORY_OPENAI_KEY }}
  AI_FACTORY_OPENAI_MODEL: ${{ secrets.AI_FACTORY_OPENAI_MODEL }}
  AI_FACTORY_CEREBRAS_KEY: ${{ secrets.AI_FACTORY_CEREBRAS_KEY }}
  AI_FACTORY_CEREBRAS_MODEL: ${{ secrets.AI_FACTORY_CEREBRAS_MODEL }}
  AI_FACTORY_OPENROUTER_KEY: ${{ secrets.AI_FACTORY_OPENROUTER_KEY }}
  AI_FACTORY_OPENROUTER_MODEL: ${{ secrets.AI_FACTORY_OPENROUTER_MODEL }}
  AI_FACTORY_ENABLE_LLM_ARCHITECT: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Factory
        run: python -m compileall factory
      - name: Run Factory smoke test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m factory "Create a research assistant"
      - name: Run example tests
        run: python -m unittest discover -s factory/examples -p 'test_*.py'
      - name: Run Patch Gate unit tests
        run: python -m unittest factory.examples.test_patch_gate
      - name: Run Patch Gate demonstration
        run: python -m factory.examples.patch_gate_demo
      - name: Run autonomous Factory demonstration with real LLM revision
        env:
          AI_FACTORY_API_KEY: ${{ secrets.AI_FACTORY_API_KEY }}
          AI_FACTORY_ENABLE_LLM_ARCHITECT: "1"
          AI_FACTORY_ENABLE_LLM_REVISION: "1"
        run: python -m factory.examples.autonomous_demo
      - name: Diagnose configured provider chain
        run: |
          if [ -z "$AI_FACTORY_GEMINI_KEY" ] && [ -z "$AI_FACTORY_GROQ_KEY" ] && [ -z "$AI_FACTORY_GITHUB_TOKEN" ] && [ -z "$AI_FACTORY_OPENAI_KEY" ] && [ -z "$AI_FACTORY_CEREBRAS_KEY" ] && [ -z "$AI_FACTORY_OPENROUTER_KEY" ]; then
            echo "No AI provider secrets are configured; skipping provider diagnostics."
            exit 0
          fi
          python -m factory.providers.provider_check
      - name: Prepare clean production output directory
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: rm -rf generated/production
      - name: Run requested Factory goal
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          goal='${{ inputs.goal }}'
          if [ -z "$goal" ]; then
            goal='Create a multi-agent AI research company that receives a business question, researches the topic using multiple sources, verifies and compares the evidence, performs financial and market analysis, identifies risks and uncertainties, writes an executive report, and has a final reviewer validate the report before delivery.'
          fi
          attempts='${{ inputs.max_attempts }}'
          if [ -z "$attempts" ]; then attempts='5'; fi
          python -m factory "$goal" --workspace generated/production --max-attempts "$attempts"
          echo "Generated production files:"
          find generated/production -type f -print | sort
      - name: Verify standalone generated system
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: |
          set -e
          root="generated/production"
          if [ ! -f "$root/team.json" ] && [ ! -f "$root/runtime/provider.py" ]; then
            candidates=$(find "$root" -mindepth 1 -maxdepth 1 -type d | sort)
            count=$(printf '%s\n' "$candidates" | sed '/^$/d' | wc -l)
            if [ "$count" -eq 1 ]; then root=$(printf '%s\n' "$candidates" | head -n 1); fi
          fi
          echo "Standalone system root: $root"
          test -f "$root/team.json"
          test -f "$root/run.py"
          test -f "$root/runtime/provider.py"
          test -f "$root/requirements.txt"
          find "$root" -type f -print | grep -E '/SPEC\.json$'
          find "$root" -type f -print | grep -E '/agents/.*/agent\.py$'
          if grep -R "from factory\." "$root"; then
            echo "ERROR: generated system still imports Factory runtime."
            exit 1
          fi
          python - "$root" <<'PY'
          from pathlib import Path
          import json, sys
          root = Path(sys.argv[1])
          data = json.loads((root / "team.json").read_text(encoding="utf-8"))
          names = {str(m.get("name", "")).lower() for m in data.get("members", [])}
          required = {"researcher", "verifier", "market_analyst", "risk_analyst", "writer", "reviewer"}
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"ERROR: generated team missing: {', '.join(missing)}")
          if data.get("entrypoint") != "run.py":
              raise SystemExit("ERROR: generated team has no run.py entrypoint")
          print("Verified six-agent standalone runnable team")
          PY
      - name: Run generated system end to end with deterministic offline provider
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        env:
          AI_FACTORY_MOCK: "1"
        run: |
          set -e
          root="generated/production"
          if [ ! -f "$root/team.json" ] && [ ! -f "$root/run.py" ]; then
            candidates=$(find "$root" -mindepth 1 -maxdepth 1 -type d | sort)
            count=$(printf '%s\n' "$candidates" | sed '/^$/d' | wc -l)
            if [ "$count" -eq 1 ]; then root=$(printf '%s\n' "$candidates" | head -n 1); fi
          fi
          cd "$root"
          python -m compileall .
          python - <<'PY'
          import importlib
          from pathlib import Path
          agents = []
          for p in sorted(Path("agents").glob("*/agent.py")):
              name = p.parent.name
              module = importlib.import_module(f"agents.{name}.agent")
              if not hasattr(module, "Agent"):
                  raise SystemExit(f"Missing Agent class: {name}")
              agents.append(name)
          expected = ["market_analyst", "researcher", "reviewer", "risk_analyst", "verifier", "writer"]
          if sorted(agents) != expected:
              raise SystemExit(f"Unexpected generated agents: {agents}")
          runner = importlib.import_module("run")
          result = runner.run("Should a business expand into a new market?")
          if result.get("status") != "completed":
              raise SystemExit(f"Pipeline did not complete: {result}")
          expected_order = ["researcher", "verifier", "market_analyst", "risk_analyst", "writer", "reviewer"]
          if result.get("agents") != expected_order:
              raise SystemExit(f"Wrong agent execution order: {result.get('agents')}")
          if not result.get("final_report"):
              raise SystemExit("Pipeline produced no final report")
          print("END-TO-END GENERATED SYSTEM PASSED")
          print("Execution order:", " -> ".join(result["agents"]))
          print("Final report:", result["final_report"]["response"])
          PY
      - name: Optional live provider smoke test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_real_provider_smoke }}
        continue-on-error: true
        env:
          AI_FACTORY_MOCK: "0"
        run: |
          set -o pipefail
          root="generated/production"
          if [ ! -f "$root/team.json" ] && [ ! -f "$root/run.py" ]; then
            candidates=$(find "$root" -mindepth 1 -maxdepth 1 -type d | sort)
            count=$(printf '%s\n' "$candidates" | sed '/^$/d' | wc -l)
            if [ "$count" -eq 1 ]; then root=$(printf '%s\n' "$candidates" | head -n 1); fi
          fi
          cd "$root"
          python run.py "Live provider diagnostic question" --json
      - name: Write repository-visible artifact manifest
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path("generated/production")
          for cache in root.rglob("__pycache__"):
              for child in cache.iterdir(): child.unlink()
              cache.rmdir()
          for pyc in root.rglob("*.pyc"):
              pyc.unlink()
          files = sorted(str(p.relative_to(root)) for p in root.rglob("*") if p.is_file())
          specs = sorted(root.rglob("SPEC.json"))
          if len(specs) != 1:
              raise SystemExit(f"Expected exactly one generated SPEC.json, found {len(specs)}")
          spec = json.loads(specs[0].read_text(encoding="utf-8"))
          goal = str(spec.get("purpose", "")).strip()
          if not goal:
              raise SystemExit("Generated SPEC.json has no non-empty purpose; refusing to publish an ambiguous artifact goal")
          manifest = {"artifact_type": "standalone_generated_ai_system", "goal": goal, "files": files, "entrypoint": "run.py", "end_to_end_test": "passed"}
          (root / "FACTORY_ARTIFACT.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Publish generated result to repository
        if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && github.ref == 'refs/heads/main' && success() }}
        run: |
          git config user.name "AI Factory"
          git config user.email "ai-factory@users.noreply.github.com"
          git add generated/production
          if git diff --cached --quiet; then
            echo "No generated output changes to publish."
          else
            git commit -m "Publish runnable standalone AI system"
            git push origin HEAD:main
          fi
      - name: Upload generated system artifact
        if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-factory-generated-agent-${{ github.run_number }}
          path: generated/production
          if-no-files-found: error
          retention-days: 14
